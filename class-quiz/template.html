<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class quiz</title><style>:root{color-scheme:dark;--ink:#f3f5ff;--muted:#b8c4e2;--line:#3c4d73}*{box-sizing:border-box}body{min-height:100vh;margin:0;padding:36px 20px;font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(ellipse at 10% 0%,#573394 0,transparent 48%),radial-gradient(ellipse at 100% 85%,#086d79 0,transparent 45%),#10162d;color:var(--ink)}.quiz{position:relative;max-width:720px;margin:auto;background:linear-gradient(145deg,#202b49f5,#151e36fa);border:1px solid #62749966;border-radius:28px;padding:32px;box-shadow:0 24px 70px #05091c80;overflow:hidden}.quiz:before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#b18aff,#67e5ed,#f8d877)}h1{font-size:clamp(24px,4vw,32px);line-height:1.25;margin:14px 0 22px;letter-spacing:-.6px}h2{font-size:clamp(18px,3vw,23px);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}p{line-height:1.7}.muted{color:var(--muted)}.quiz>p:first-child{display:inline-block;margin:0;padding:6px 12px;border:1px solid #9f87e766;border-radius:999px;background:#aa85ff14;color:#ded1ff;font-size:12px;font-weight:750;letter-spacing:1.6px;text-transform:uppercase}.options{display:grid;gap:12px;counter-reset:choice}button{font:inherit;text-align:left;border:1px solid var(--line);background:#263352;color:var(--ink);border-radius:15px;padding:17px;cursor:pointer;white-space:pre-wrap;overflow-wrap:anywhere;transition:background .15s,border-color .15s,transform .15s}button:hover:not(:disabled){border-color:#a9a0ff;background:#33436a;transform:translateY(-2px)}button:focus-visible{outline:3px solid #78edf1;outline-offset:4px}button:disabled{cursor:default}.options button{display:flex;align-items:center;gap:14px}.options button:before{counter-increment:choice;content:counter(choice,upper-alpha);display:grid;place-items:center;flex:0 0 30px;height:30px;border-radius:9px;background:#ffffff12;font-size:12px;font-weight:800;color:#d8dfff}.correct{background:#134b42;border-color:#56d9ad}.wrong{background:#542d41;border-color:#ff9bab}.primary{background:linear-gradient(110deg,#b49aff,#7ce8ee);color:#111b34;border:0;text-align:center;margin-top:18px;font-weight:800;min-width:160px;box-shadow:0 6px 20px #8c71ef28}.primary:hover:not(:disabled){background:linear-gradient(110deg,#c6b2ff,#9af3f5);color:#111b34}.progress{height:9px;background:#35405e;border-radius:99px;margin:20px 0;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#b18aff,#67e5ed);width:0;transition:width .2s}#feedback{padding:4px 0;color:#e1e8fa}#result{text-align:center}#result h2{color:#c4f6ef}.badge{display:inline-block;border:1px solid #f6d98c;background:linear-gradient(140deg,#644b20,#3c321e);color:#fff0bf;border-radius:22px;padding:22px;margin:12px 0;font-size:24px;font-weight:800;box-shadow:0 0 30px #eab84b15}.score{font-size:64px;line-height:1.2;margin:24px 0 10px;font-weight:850;letter-spacing:-2px;color:#9beef0}.hidden{display:none}@media(max-width:450px){body{padding:16px 10px}.quiz{padding:24px 18px;border-radius:22px}.options button{padding:14px;gap:10px}.primary{width:100%}}@media(prefers-reduced-motion:reduce){button,.fill{transition:none}button:hover:not(:disabled){transform:none}}__CHARACTER_CSS__</style></head><body><main class="quiz"><p class="muted">Quick class quiz</p><h1 id="title"></h1><section id="welcome"><p id="intro"></p><button class="primary" id="start">Start quiz</button></section><section id="play" class="hidden"><p id="count" class="muted"></p><div class="progress"><div class="fill" id="progress"></div></div><h2 id="question"></h2><div id="options" class="options"></div><p id="feedback" role="status" aria-live="polite"></p><button id="next" class="primary hidden">Next question</button></section><section id="result" class="hidden" aria-live="polite"><h2>Congratulations — you completed the quiz! 🎉</h2><p class="score" id="score"></p><div class="badge" id="badge"></div><p id="message"></p><p class="muted">Try again for a new question order.</p><button id="retry" class="primary">Try again</button></section></main><script id="theme-data" type="application/json">__THEMES__</script><script id="mascot-data" type="application/json">__CHARACTERS__</script><script id="quiz-data" type="application/json">__QUIZ_DATA__</script><script>
const data=JSON.parse(document.getElementById('quiz-data').textContent),el=id=>document.getElementById(id);
function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
// The content fingerprint keeps different quizzes and revisions separate.
let hash=2166136261;for(const c of JSON.stringify(data)){hash=Math.imul(hash^c.charCodeAt(0),16777619)}
const storageKey='class-quiz-v2-'+(hash>>>0).toString(16);
let state=null,storageOK=true;
try{localStorage.setItem(storageKey+'-probe','1');localStorage.removeItem(storageKey+'-probe');const raw=localStorage.getItem(storageKey);if(raw){state=JSON.parse(raw);if(state.version!==2||!Array.isArray(state.questions)||!Array.isArray(state.answers))throw Error('Invalid saved attempt')}}catch(e){storageOK=false}
el('title').textContent=data.title;document.title=data.title;
const limit=Math.min(data.questions.length,Math.max(1,Number(data.questionCount)||5));
el('intro').textContent=`Answer ${limit} questions. Submitted answers are locked. Refreshing resumes this attempt. Answers and explanations appear at the end.`;
const history=document.createElement('p');history.className='muted';el('result').append(history);
const review=document.createElement('div');review.style.textAlign='left';el('result').append(review);
function warn(){el('feedback').textContent='Progress cannot be saved in this browser. Please allow browser storage or open the quiz in a supported browser.';el('intro').textContent=el('feedback').textContent;el('start').disabled=true;el('next').disabled=true;el('retry').disabled=true}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state));return true}catch(e){storageOK=false;warn();return false}}
function score(){return state.answers.reduce((sum,a,i)=>sum+(a===data.questions[state.questions[i]].answer?1:0),0)}
function start(){if(!storageOK)return;const records=state?.records||[];state={version:2,attempt:records.length+1,questions:shuffle(data.questions.map((_,i)=>i)).slice(0,limit),orders:[],answers:Array(limit).fill(null),position:0,complete:false,records};state.orders=state.questions.map(i=>shuffle(data.questions[i].options.map((_,j)=>j)));if(save())show()}
function show(){el('welcome').classList.add('hidden');el('result').classList.add('hidden');el('play').classList.remove('hidden');const p=state.position,q=data.questions[state.questions[p]],submitted=state.answers[p]!==null;el('count').textContent=`Attempt ${state.attempt} · Question ${p+1} of ${state.questions.length}`;el('progress').style.width=`${p/state.questions.length*100}%`;el('question').textContent=q.question;el('feedback').textContent=submitted?'Answer saved and locked.':'';el('next').classList.toggle('hidden',!submitted);el('next').textContent=p===state.questions.length-1?'See my score':'Next question';el('options').replaceChildren();state.orders[p].forEach(index=>{const b=document.createElement('button');b.textContent=q.options[index];b.dataset.index=index;b.disabled=submitted;if(state.answers[p]===index){b.style.borderColor='#b49aff';b.setAttribute('aria-pressed','true')}b.onclick=()=>answer(index);el('options').append(b)});el('question').setAttribute('tabindex','-1');el('question').focus();if(!storageOK)warn()}
function answer(index){if(!storageOK||state.complete||state.answers[state.position]!==null)return;state.answers[state.position]=index;if(save())show()}
function next(){if(!storageOK||state.answers[state.position]===null)return;if(state.position+1<state.questions.length){state.position++;if(save())show();return}state.complete=true;state.records.push({attempt:state.attempt,score:score(),total:state.questions.length});if(save())finish()}
function finish(){el('welcome').classList.add('hidden');el('play').classList.add('hidden');el('result').classList.remove('hidden');const points=score(),total=state.questions.length,ratio=points/total;el('score').textContent=`${points} / ${total}`;el('badge').textContent=ratio===1?'🌟 Quiz Star':ratio>=.6?'🏅 Great Progress':'🌱 Growing Learner';el('message').textContent=`Attempt ${state.attempt} completed. Well done for finishing! Review your answers below.`;history.textContent='Saved scores on this browser: '+state.records.map(r=>`Attempt ${r.attempt}: ${r.score}/${r.total}`).join(' · ');review.replaceChildren();state.questions.forEach((id,i)=>{const q=data.questions[id],box=document.createElement('section'),heading=document.createElement('h2'),detail=document.createElement('p');heading.textContent=`${i+1}. ${q.question}`;detail.textContent=`Your answer: ${q.options[state.answers[i]]}. Correct answer: ${q.options[q.answer]}. ${q.explanation||''}`;box.append(heading,detail);review.append(box)});el('retry').textContent='Start another practice attempt';el('retry').classList.toggle('hidden',data.mode==='test');if(!storageOK)warn()}
el('start').onclick=start;el('retry').onclick=start;el('next').onclick=next;
__CHARACTER_RUNTIME__

if(!storageOK)warn();else if(state){if(state.complete)finish();else show()}
</script></body></html>
